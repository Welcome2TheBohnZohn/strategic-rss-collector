name: Apply RSS Cleanup Patch

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/apply-rss-cleanup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Patch RSS builder
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("rss_builder.py")
          text = path.read_text(encoding="utf-8")

          old_canonical = '''def canonical_url(
              base_url,
              href,
          ):

              try:

                  url = urljoin(
                      base_url,
                      href,
                  )

                  parsed = urlparse(
                      url
                  )

                  if parsed.scheme not in (
                      "http",
                      "https",
                  ):

                      return ""

                  return parsed._replace(
                      fragment=""
                  ).geturl()

              except Exception:

                  return ""
          '''

          new_canonical = '''def canonical_url(
              base_url,
              href,
          ):

              try:

                  # Some source pages publish href values with stray leading
                  # or trailing whitespace. Strip that before urljoin so a
                  # valid URL does not become a request ending in %20/%20%20.
                  clean_base = str(
                      base_url
                      or ""
                  ).strip()

                  clean_href = str(
                      href
                      or ""
                  ).strip()

                  if not clean_href:

                      return ""

                  url = urljoin(
                      clean_base,
                      clean_href,
                  ).strip()

                  parsed = urlparse(
                      url
                  )

                  if parsed.scheme not in (
                      "http",
                      "https",
                  ):

                      return ""

                  return parsed._replace(
                      fragment=""
                  ).geturl().strip()

              except Exception:

                  return ""
          '''

          if old_canonical not in text:
              raise SystemExit("canonical_url block did not match live file")

          text = text.replace(
              old_canonical,
              new_canonical,
              1,
          )

          helper_marker = '''def extract_article_text(soup):
          '''

          helper = '''def norinco_article_title(
              page_html,
              fallback_title,
              extracted_title,
          ):

              generic_titles = {
                  "新闻中心",
                  "首页",
                  "中国兵器工业集团有限公司",
                  "NORINCO Group",
              }

              current = normalize_text(
                  extracted_title
              )

              if (
                  current
                  and current not in generic_titles
              ):

                  return current

              soup = BeautifulSoup(
                  page_html,
                  "lxml",
              )

              # NORINCO article pages often expose a generic H1/page title,
              # while the actual story headline appears in another heading
              # or metadata field. Prefer those before falling back to the
              # listing-page anchor text.
              meta_checks = [
                  (
                      "property",
                      "og:title",
                  ),
                  (
                      "name",
                      "ArticleTitle",
                  ),
                  (
                      "name",
                      "articleTitle",
                  ),
                  (
                      "name",
                      "title",
                  ),
              ]

              for attribute, value in meta_checks:

                  node = soup.find(
                      "meta",
                      attrs={
                          attribute: value
                      },
                  )

                  if not node:

                      continue

                  title_text = normalize_text(
                      node.get(
                          "content",
                          "",
                      )
                  )

                  if (
                      4 <= len(
                          title_text
                      ) <= 300
                      and title_text not in generic_titles
                  ):

                      return title_text

              fallback = normalize_text(
                  fallback_title
              )

              fallback_prefix = re.sub(
                  r"(?:\\.{3,}|…+)$",
                  "",
                  fallback,
              ).strip()

              heading_candidates = []

              for node in soup.find_all(
                  [
                      "h1",
                      "h2",
                      "h3",
                      "h4",
                  ]
              ):

                  title_text = normalize_text(
                      node.get_text(
                          " ",
                          strip=True,
                      )
                  )

                  if (
                      4 <= len(
                          title_text
                      ) <= 300
                      and title_text not in generic_titles
                  ):

                      heading_candidates.append(
                          title_text
                      )

              if (
                  fallback_prefix
                  and len(
                      fallback_prefix
                  ) >= 6
              ):

                  for title_text in heading_candidates:

                      if title_text.startswith(
                          fallback_prefix
                      ):

                          return title_text

              if heading_candidates:

                  return heading_candidates[
                      0
                  ]

              if (
                  fallback
                  and fallback not in generic_titles
              ):

                  return fallback

              return (
                  current
                  or fallback
                  or "Untitled"
              )


          '''

          if helper_marker not in text:
              raise SystemExit("extract_article_text marker not found")

          text = text.replace(
              helper_marker,
              helper + helper_marker,
              1,
          )

          old_collect = '''            article = extract_article(
                          page_html,
                          candidate[
                              "anchor_title"
                          ],
                          final_url,
                      )

                      if len(
          '''

          new_collect = '''            article = extract_article(
                          page_html,
                          candidate[
                              "anchor_title"
                          ],
                          final_url,
                      )

                      if source.get(
                          "slug"
                      ) == "norinco-cn":

                          article[
                              "title"
                          ] = norinco_article_title(
                              page_html,
                              candidate[
                                  "anchor_title"
                              ],
                              article.get(
                                  "title",
                                  "",
                              ),
                          )

                      if len(
          '''

          if old_collect not in text:
              raise SystemExit("collect_html_articles block did not match live file")

          text = text.replace(
              old_collect,
              new_collect,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )
          PY

          python -m py_compile rss_builder.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_builder.py
          git commit -m "Clean source URLs and fix NORINCO titles"
          git push
