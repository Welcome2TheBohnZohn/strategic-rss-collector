name: Apply Iran MFA Content Dedupe

on:
  push:
    paths:
      - '.github/workflows/apply-iran-mfa-dedupe.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply patch
        run: |
          python apply_iran_mfa_dedupe.py
          python -m py_compile rss_builder.py
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test Iran MFA uniqueness
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          import rss_builder

          source = next(
              source for source in rss_builder.load_sources()
              if source['slug'] == 'iran-mfa-en'
          )
          status = rss_builder.run_source(source)
          print('TARGET STATUS', status)
          assert status['feed_items'] == 12, status
          assert status['articles_with_date'] == 12, status

          root = ET.parse('feeds/iran-mfa-en.xml').getroot()
          items = root.findall('./channel/item')
          assert len(items) == 12
          pairs = [
              ((item.findtext('title') or '').casefold(),
               (item.findtext('description') or '').casefold())
              for item in items
          ]
          assert len(set(pairs)) == 12, pairs

          diagnostics = json.loads(
              open('diagnostics/iran-mfa-en-archive-diagnostic.json', encoding='utf-8').read()
          )
          print('DIAGNOSTICS', diagnostics)
          assert diagnostics['duplicate_content_skipped'] >= 1, diagnostics

          for item in items:
              print('TITLE:', item.findtext('title'))
              print('DATE:', item.findtext('pubDate'))
              print('GUID:', item.findtext('guid'))
          PY
      - name: Commit Iran MFA dedupe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_builder.py feeds/iran-mfa-en.xml articles/iran-mfa-en diagnostics/iran-mfa-en-archive-diagnostic.json
          git commit -m "Deduplicate Iran MFA feed content"
          git push
