name: Improve Telegram Feed Titles

on:
  push:
    paths:
      - '.github/workflows/improve-telegram-titles.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply title patch
        run: |
          python tools/improve_telegram_titles.py
          python -m py_compile rss_builder.py

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Regenerate Russian feeds
        run: |
          python - <<'PY'
          import rss_builder

          wanted = {'mil-ru-en', 'mid-ru-en'}
          for source in rss_builder.load_sources():
              if source['slug'] not in wanted:
                  continue
              status = rss_builder.run_source(source)
              print('STATUS', status)
              assert status['feed_items'] > 0
          PY

      - name: Commit title improvement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_builder.py feeds/mil-ru-en.xml feeds/mid-ru-en.xml articles/mil-ru-en articles/mid-ru-en
          git commit -m "Improve Russian Telegram feed titles"
          git push
