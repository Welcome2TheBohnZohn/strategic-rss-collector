name: Full Production Validation

on:
  push:
    paths:
      - '.github/workflows/full-production-validation.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run full RSS collector
        run: |
          python rss_builder.py

      - name: Show status report
        if: always()
        run: |
          cat feeds/status-report.txt

      - name: Commit generated outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add feeds articles diagnostics

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Validate full strategic RSS collection"
            git push
          fi
