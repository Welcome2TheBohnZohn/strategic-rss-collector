name: Build Strategic RSS Feeds

on:
  workflow_dispatch:

  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run RSS collector
        run: |
          python rss_builder.py

      - name: Show status report
        if: always()
        run: |
          echo "===== RSS STATUS REPORT ====="

          if [ -f feeds/status-report.txt ]; then
            cat feeds/status-report.txt
          else
            echo "No status report was generated."
          fi

      - name: Commit generated feeds, articles, and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feeds articles diagnostics

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update strategic RSS feeds"
            git push
          fi
