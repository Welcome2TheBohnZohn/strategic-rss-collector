name: Probe CNNVD and Defense News

on:
  push:
    paths:
      - '.github/workflows/probe-two-sources.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install probe dependencies
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Probe Defense News browser structure
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          import re
          from playwright.sync_api import sync_playwright

          UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151.0.0.0 Safari/537.36'
          dates = [(datetime.now(timezone.utc).date() - timedelta(days=i)).isoformat() for i in range(0, 10)]
          dates.append('2026-06-17')

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=['--no-sandbox'])
              page = browser.new_page(user_agent=UA, locale='zh-CN')
              for ds in dates:
                  url = f'http://www.81.cn/szb_223187/gfbszblb/index.html?paperDate={ds}&paperName=zggfb&paperNumber=01'
                  try:
                      resp = page.goto(url, wait_until='domcontentloaded', timeout=30000)
                      page.wait_for_timeout(3500)
                      anchors = page.locator('a').evaluate_all("els => els.map(a => ({text:(a.innerText||'').trim().replace(/\\s+/g,' '), href:a.href||''}))")
                      detail = [a for a in anchors if 'szbxq' in a['href'] or 'articleid=' in a['href']]
                      body = page.locator('body').inner_text()
                      print(f'DATE {ds} status={resp.status if resp else None} final={page.url} anchors={len(anchors)} detail={len(detail)}')
                      print('BODY_TOP', body[:1800].replace('\n',' | '))
                      for a in detail[:30]:
                          print('DETAIL', a)
                      html = page.content()
                      ids = sorted(set(re.findall(r'articleid(?:=|%3D|["\']\s*[:=]\s*["\']?)(\d+)', html, flags=re.I)))
                      print('ARTICLEIDS', ids[:30])
                      if detail or ids:
                          print('FOUND', ds)
                          break
                  except Exception as e:
                      print('ERROR', ds, type(e).__name__, e)
              browser.close()
          PY
