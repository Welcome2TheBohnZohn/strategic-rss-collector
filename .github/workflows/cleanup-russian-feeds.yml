name: Apply Archive Cleanup and Russian Feed Fix

on:
  push:
    paths:
      - '.github/workflows/cleanup-russian-feeds.yml'

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply patch
        run: |
          python tools/apply_cleanup_russian_patch.py
          python -m py_compile rss_builder.py
          python -m json.tool sources.json > /dev/null

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Russian Telegram collectors
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          import rss_builder

          wanted = {'mil-ru-en', 'mid-ru-en'}
          sources = [
              source
              for source in rss_builder.load_sources()
              if source['slug'] in wanted
          ]

          for source in sources:
              status = rss_builder.run_source(source)
              print('\nTARGET STATUS', status)
              assert status['feed_items'] > 0, status

              feed_path = rss_builder.FEEDS_DIR / f"{source['slug']}.xml"
              root = ET.parse(feed_path).getroot()
              items = root.findall('./channel/item')
              assert items, source['slug']

              print('XML ITEMS', source['slug'], len(items))
              for item in items[:3]:
                  print('TITLE:', item.findtext('title'))
                  print('LINK:', item.findtext('link'))
                  print('DATE:', item.findtext('pubDate'))
          PY

      - name: Commit fixes and generated Russian feeds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_builder.py sources.json feeds articles diagnostics

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Clean article archive and restore Russian feeds"
            git push
          fi
