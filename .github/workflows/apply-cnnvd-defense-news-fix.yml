name: Apply CNNVD and Defense News Fix

on:
  push:
    paths:
      - '.github/workflows/apply-cnnvd-defense-news-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Apply patch script
        run: |
          python tools/apply_cnnvd_defense_news_fix.py
          python -m py_compile rss_builder.py
          python -m json.tool sources.json >/dev/null

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rss_builder.py sources.json
          git commit -m "Fix CNNVD and Defense News collectors"
          git push
